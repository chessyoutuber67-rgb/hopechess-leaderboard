
name: HOPECHESS API Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hopechess-leaderboard
  cancel-in-progress: false

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Synchronize with GitHub
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Chess.com API test
        run: python test_api.py

      - name: Fetch player ratings
        run: python fetch_ratings.py

      - name: Build leaderboard
        run: python build_leaderboard.py

      - name: Save leaderboard to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rating_history.json leaderboard.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update HOPECHESS leaderboard"
            git push origin main
          fi
