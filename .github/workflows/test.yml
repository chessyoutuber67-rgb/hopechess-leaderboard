
name: HOPECHESS API Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Chess.com API test
        run: python test_api.py

      - name: Fetch player ratings
        run: python fetch_ratings.py

      - name: Save rating history to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rating_history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update HOPECHESS rating history"
            git push
          else
            echo "No rating history changes to save."
          fi
